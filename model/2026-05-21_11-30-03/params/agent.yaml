seed: 42
device: cuda:0
num_steps_per_env: 128
max_iterations: 500
empirical_normalization: null
obs_groups: {}
clip_actions: null
save_interval: 50
experiment_name: drone_avoidance_direct
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: 2026-05-21_09-30-40
load_checkpoint: model_1950.pt
class_name: OnPolicyRunner
policy:
  class_name: CnnActorCritic
  init_noise_std: 0.2
  noise_std_type: scalar
  state_dependent_std: false
  actor_obs_normalization: false
  critic_obs_normalization: false
  actor_hidden_dims:
  - 256
  - 128
  - 64
  critic_hidden_dims:
  - 256
  - 128
  - 64
  activation: elu
  state_dim: 12
  depth_height: 72
  depth_width: 128
  depth_feature_dim: 128
  state_feature_dim: 64
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 8
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.001
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
